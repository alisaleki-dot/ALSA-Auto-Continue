name: Build ALSA APK - One File

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create clean Android project
        shell: bash
        run: | rm -rf generated-project mkdir -p generated-project echo '' | base64 --decode > /tmp/alsa-project.zip unzip -q /tmp/alsa-project.zip -d generated-project 
      - name: Build debug APK
        working-directory: generated-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSA-Auto-Continue-APK
          path: generated-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30          retention-days: 30
